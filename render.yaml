services:
  - type: web
    name: pagepulse-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        sync: false
      - key: FETCH_TIMEOUT_MS
        value: 8000
      - key: MAX_CONTENT_LENGTH
        value: 5000000
